<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- White Background with Subtle Windows 95 Border -->
  <rect width="512" height="512" fill="#ffffff" rx="32"/>
  
  <!-- Subtle Blueprint Drafting Gridlines -->
  <g stroke="#e2e8f0" stroke-width="3" opacity="0.8">
    <line x1="64" y1="0" x2="64" y2="512"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="192" y1="0" x2="192" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="320" y1="0" x2="320" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
    <line x1="448" y1="0" x2="448" y2="512"/>
    <line x1="0" y1="64" x2="512" y2="64"/>
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="192" x2="512" y2="192"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="320" x2="512" y2="320"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="0" y1="448" x2="512" y2="448"/>
  </g>

  <!-- Official CADN'T Blue Isometric Cube (Apostrophe Cube) -->
  <!-- Top Face (Sky Blue / Cyan) -->
  <polygon points="256,76 416,168 256,260 96,168" fill="#38bdf8" stroke="#000000" stroke-width="14" stroke-linejoin="round"/>
  
  <!-- Left Face (Royal Blue) -->
  <polygon points="96,168 256,260 256,436 96,344" fill="#0284c7" stroke="#000000" stroke-width="14" stroke-linejoin="round"/>
  
  <!-- Right Face (Deep Navy Blue) -->
  <polygon points="256,260 416,168 416,344 256,436" fill="#0369a1" stroke="#000000" stroke-width="14" stroke-linejoin="round"/>

  <!-- Inner Edge Highlights -->
  <line x1="256" y1="260" x2="256" y2="436" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
  <line x1="96" y1="168" x2="256" y2="260" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
  <line x1="416" y1="168" x2="256" y2="260" stroke="#000000" stroke-width="14" stroke-linecap="round"/>
</svg>
