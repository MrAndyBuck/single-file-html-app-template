<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Go Knicks!</title>
  <style>
    :root {
      --knicks-blue: #006BB6;
      --knicks-orange: #F58426;
      --knicks-silver: #BEC0C2;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 50% 50%, #0d1b2a, #050b14);
      color: #f9fafb;
      text-align: center;
      padding: 24px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: 9999px;
      background: rgba(245, 132, 38, 0.15);
      border: 1px solid rgba(245, 132, 38, 0.4);
      color: var(--knicks-orange);
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }
    .badge-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--knicks-orange);
      box-shadow: 0 0 12px var(--knicks-orange);
    }
    h1 {
      font-size: 4.5rem;
      margin: 0 0 1rem 0;
      letter-spacing: -0.03em;
      font-weight: 900;
      background: linear-gradient(135deg, #ffffff 30%, var(--knicks-orange) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 30px rgba(0, 107, 182, 0.4);
    }
    p {
      color: #93c5fd;
      font-size: 1.35rem;
      max-width: 500px;
      line-height: 1.6;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="badge">
    <span class="badge-dot"></span>
    New York Basketball
  </div>
  <h1>Go Knicks</h1>
  <p>Orange &amp; Blue Skies</p>
</body>
</html>
